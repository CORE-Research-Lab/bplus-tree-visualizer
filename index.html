<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>body{margin:0}</style>
</head>
<body>
<title>B+ Tree Visualizer</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=Red+Hat+Display:wght@600;700;800&family=Source+Sans+3:wght@400;600;700&display=swap">
<style>
/* Layout: lecture-slide workbench. Preset rail on top, the tree as the stage, and beneath it the narration, the slide algorithm and the step trace side by side. */
:root{
  --bg:#f1f3f4; --surface:#ffffff; --stage:#fafbfc; --ink:#18233f; --muted:#5b6880; --line:#d5dbe3;
  --accent:#0e7c7b; --accent-soft:#dff1ef; --on-accent:#ffffff;
  --leaf-bg:#e8f5f3; --leaf-line:#2a9d8f; --idx-bg:#1b2a4a; --idx-fg:#ffffff; --idx-line:#1b2a4a; --edge:#8a97ab;
  --new:#15803d; --del:#c62828; --up:#b45309; --mov:#1d4ed8; --on-sem:#ffffff;
  --f-display:"Red Hat Display","Segoe UI",system-ui,sans-serif;
  --f-body:"Source Sans 3","Segoe UI",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0f141c; --surface:#171f2b; --stage:#121923; --ink:#e7ecf3; --muted:#97a3b6; --line:#2c394b;
  --accent:#3ccfc0; --accent-soft:#143532; --on-accent:#06211f;
  --leaf-bg:#12302e; --leaf-line:#3ccfc0; --idx-bg:#33456b; --idx-fg:#ffffff; --idx-line:#6079ab; --edge:#62728a;
  --new:#1f9a4f; --del:#d64545; --up:#c27a12; --mov:#3f74e6; --on-sem:#ffffff; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0f141c; --surface:#171f2b; --stage:#121923; --ink:#e7ecf3; --muted:#97a3b6; --line:#2c394b;
  --accent:#3ccfc0; --accent-soft:#143532; --on-accent:#06211f;
  --leaf-bg:#12302e; --leaf-line:#3ccfc0; --idx-bg:#33456b; --idx-fg:#ffffff; --idx-line:#6079ab; --edge:#62728a;
  --new:#1f9a4f; --del:#d64545; --up:#c27a12; --mov:#3f74e6; --on-sem:#ffffff; color-scheme:dark }

*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font:16px/1.5 var(--f-body)}
.wrap{max-width:1280px;margin:0 auto;padding-block:20px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance}
h1{font-size:20px;font-weight:800}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.top{display:flex;flex-wrap:wrap;align-items:center;gap:8px 24px}
.presets{display:flex;flex-wrap:wrap;gap:2px 4px}
.preset{background:none;border:0;border-bottom:2px solid transparent;padding:4px 8px;color:var(--muted);font-weight:600}
.preset:hover{color:var(--ink)}
.preset[aria-pressed="true"]{color:var(--accent);border-bottom-color:var(--accent)}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.ops{display:flex;flex-wrap:wrap;gap:6px}
.op,.btn{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:5px 11px;font-weight:600}
.op{font:600 14px var(--f-mono)}
.op:hover,.btn:hover{border-color:var(--accent)}
.op.done{opacity:.45}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn:disabled{opacity:.4;cursor:default}
.spacer{flex:1}
.bar input{width:120px;padding:5px 9px;border:1px solid var(--line);border-radius:8px;background:var(--surface);font:500 14px var(--f-mono)}
.msg{color:var(--del);font-size:14px}
.main{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:14px;align-items:stretch}
@media (max-width:1100px){.main{grid-template-columns:minmax(0,1fr)} .algo .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr))} .card.note{grid-column:1/-1}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;min-width:0}
.stage{display:flex;flex-direction:column}
.scroll{overflow-x:auto;padding:20px 12px;min-height:300px;display:flex;align-items:center;flex:1}
#svg{display:block;margin:0 auto;overflow:visible;flex:none}
.facts,.legend{display:flex;flex-wrap:wrap;gap:4px 18px;padding:10px 18px;font-size:14px;color:var(--muted)}
.facts{border-bottom:1px solid var(--line)} .facts b{color:var(--ink)}
.legend{font-size:13px;padding-top:0}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:11px;height:11px;border-radius:3px;display:inline-block;flex:none}
.now{border-top:1px solid var(--line);padding:14px 18px 16px;display:flex;flex-direction:column;gap:8px}
.count{color:var(--muted);font-size:14px;font-variant-numeric:tabular-nums}
#title{font-size:20px;font-weight:700;line-height:1.25}
#text{font-size:17px;margin:0;max-width:72ch;min-height:3em}
.k{font-family:var(--f-mono);font-weight:600}
.scratch{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.scratch i{font:600 15px var(--f-mono);font-style:normal;padding:2px 7px;border-radius:5px}
.scratch i.mid{background:var(--up);color:var(--on-sem)}
.scratch em{color:var(--muted);font-style:normal;font-size:14px;margin-left:6px}
.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.algo{padding:16px}
.algo h3{font-size:16px;margin-bottom:10px}
.cards{display:flex;flex-direction:column;gap:6px}
.card{display:grid;grid-template-columns:30px minmax(0,1fr);gap:10px;align-items:start;border:1px solid transparent;border-radius:10px;padding:8px;color:var(--muted)}
.card .n{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font:700 12.5px var(--f-body);background:var(--bg)}
.card b{display:block;line-height:1.3;padding-top:4px}
.card p{margin:3px 0 0;font-size:14px;line-height:1.4}
.card.seen{color:var(--ink)}
.card.seen .n{background:var(--accent-soft);color:var(--accent)}
.card.on{border-color:var(--accent);background:var(--accent-soft);color:var(--ink)}
.card.on .n{background:var(--accent);color:var(--on-accent)}
.card .lvl{display:block;margin-top:4px;font-size:13px;font-weight:700;color:var(--accent)}
.card.note{grid-template-columns:minmax(0,1fr)}
.card.note p{margin:0}

/* SVG */
.edge{stroke:var(--edge);stroke-width:1.4}
.edge.on{stroke:var(--accent);stroke-width:3}
.link{stroke:var(--edge);stroke-width:1.2}
.linkhead{fill:var(--edge)}
.box{stroke-width:1.6}
.leaf .box{fill:var(--leaf-bg);stroke:var(--leaf-line)}
.idx .box{fill:var(--idx-bg);stroke:var(--idx-line)}
.div{stroke-width:1}
.leaf .div{stroke:var(--leaf-line);opacity:.45}
.idx .div{stroke:var(--idx-fg);opacity:.28}
.key{font:600 13.5px var(--f-mono);text-anchor:middle;dominant-baseline:central}
.leaf .key{fill:var(--ink)} .idx .key{fill:var(--idx-fg)}
.dot{fill:var(--idx-fg);stroke:var(--idx-line);stroke-width:1.2}
.ring{fill:none;stroke-width:3}
.s-active .ring{stroke:var(--accent)} .s-new .ring{stroke:var(--new)} .s-warn .ring{stroke:var(--del);stroke-dasharray:6 4}
.s-sib .ring{stroke:var(--mov);stroke-dasharray:2 4} .s-moved .ring{stroke:var(--mov)}
.kc{stroke:none}
.kc.new{fill:var(--new)} .kc.del{fill:var(--del)} .kc.up{fill:var(--up)} .kc.moved{fill:var(--mov)}
.key.hl{fill:var(--on-sem)}
.occ{font:600 11.5px var(--f-mono);fill:var(--muted);text-anchor:middle}
.occ.side{text-anchor:start;dominant-baseline:central}
.occ.bad{fill:var(--del)}
.tag{font:700 13px var(--f-body);fill:var(--ink)}
.occ.up{fill:var(--up);font-weight:700}
.pending .box{fill-opacity:.25;stroke-dasharray:5 4}
</style>

<div class="wrap">
  <div class="top">
    <h1>B+ Tree Visualizer</h1>
    <div class="presets" id="presets"></div>
  </div>
  <div class="bar">
    <div class="ops" id="ops"></div>
    <span class="spacer"></span>
    <input id="keys" inputmode="numeric" placeholder="your key" aria-label="Your own key or keys" autocomplete="off">
    <button class="btn" id="doIns">Insert</button>
    <button class="btn" id="doDel">Delete</button>
    <button class="btn" id="reset">Reset</button>
    <span class="msg" id="msg" role="status"></span>
  </div>
  <div class="main">
    <section class="panel stage">
      <div class="facts" id="facts"></div>
      <div class="scroll" id="scroll"><svg id="svg" role="img" aria-label="B+ tree diagram"></svg></div>
      <div class="legend">
        <span><i class="sw" style="background:var(--idx-bg)"></i>index</span>
        <span><i class="sw" style="background:var(--leaf-bg);border:1.5px solid var(--leaf-line)"></i>leaf</span>
        <span><i class="sw" style="background:var(--new)"></i>inserted</span>
        <span><i class="sw" style="background:var(--del)"></i>deleted / violation</span>
        <span><i class="sw" style="background:var(--up)"></i>moved up</span>
        <span><i class="sw" style="background:var(--mov)"></i>moved across</span>
      </div>
      <div class="now" aria-live="polite">
        <h2 id="title"></h2>
        <p id="text"></p>
        <div class="scratch" id="scratch" hidden></div>
        <div class="controls">
          <button class="btn" id="prev">← Back</button>
          <button class="btn primary" id="next">Next →</button>
          <span class="count" id="count"></span>
        </div>
      </div>
    </section>
    <section class="panel algo" id="algo"></section>
  </div>
</div>

<script>
/* ===== B+ tree engine =====
   cap = max entries in a leaf = max keys in an index node (cap+1 pointers).
   Routing: a search key equal to a separator goes RIGHT (the copied-up key is the first entry of the right leaf).
   Fill factor 50%, counted in pointers: leaf >= ceil(cap/2) entries, index node >= ceil((cap+1)/2) pointers. Root exempt. */
const E = (() => {
  const clone = o => JSON.parse(JSON.stringify(o));
  const minLeaf = t => Math.ceil(t.cap / 2);
  const minPtr = t => Math.ceil((t.cap + 1) / 2);
  const K = (v, star) => `<b class="k">${v}${star ? '*' : ''}</b>`;
  const ord = i => ['1st', '2nd', '3rd', '4th', '5th', '6th'][i] || (i + 1) + 'th';
  const DONE = ' <b>Done.</b>';

  function build(t, s) {
    if (Array.isArray(s)) return { id: t.nextId++, leaf: true, keys: s.slice(), children: [] };
    const n = { id: t.nextId++, leaf: false, keys: s.k.slice(), children: [] };
    n.children = s.c.map(c => build(t, c));
    return n;
  }
  function make(cap, spec) {
    const t = { cap, nextId: 1, root: null };
    t.root = build(t, spec);
    return t;
  }
  const route = (n, k) => { let i = 0; while (i < n.keys.length && k >= n.keys[i]) i++; return i; };
  function routeText(n, k, i) {
    const ks = n.keys;
    if (i === 0) return { cmp: `${k} &lt; ${ks[0]}`, ptr: 'the leftmost pointer' };
    if (i === ks.length) return { cmp: `${k} ≥ ${ks[i - 1]}`, ptr: 'the rightmost pointer' };
    return { cmp: `${ks[i - 1]} ≤ ${k} &lt; ${ks[i]}`, ptr: `the ${ord(i)} pointer` };
  }
  function insertSorted(a, k) { let i = 0; while (i < a.length && a[i] < k) i++; a.splice(i, 0, k); }

  function runner(t, op, steps) {
    const add = s => { s.tree = clone(t); s.op = op; s.hl = s.hl || {}; steps.push(s); };
    const algoOf = { insert: 'ins', delete: 'del', search: 'find' }[op.type];

    function descend(k) {
      const path = []; let n = t.root;
      while (!n.leaf) {
        const i = route(n, k), r = routeText(n, k, i);
        add({
          algo: [algoOf + '-1'], title: r.cmp,
          text: `Follow ${r.ptr}.${i > 0 && n.keys[i - 1] === k ? ' An equal key goes right.' : ''}`,
          hl: { nodes: { [n.id]: 'active' }, edge: [n.id, i] }
        });
        path.push({ n, i }); n = n.children[i];
      }
      return { path, leaf: n };
    }

    function insert(k) {
      const { path, leaf: L } = descend(k);
      if (L.keys.includes(k)) {
        add({ algo: ['ins-1'], title: `${k}* already exists`, text: `Search keys are unique here. Nothing changes.`, hl: { nodes: { [L.id]: 'active' }, keys: { [L.id]: { [k]: 'moved' } }, tags: { [L.id]: 'L' } } });
        return;
      }
      if (L.keys.length < t.cap) {
        insertSorted(L.keys, k);
        add({ algo: ['ins-2a'], title: `Insert ${k}* into L`, text: `L has space.${DONE}`, hl: { nodes: { [L.id]: 'new' }, keys: { [L.id]: { [k]: 'new' } }, tags: { [L.id]: 'L' } } });
        return;
      }
      insertSorted(L.keys, k);
      const mid = Math.floor((t.cap + 1) / 2);
      add({
        algo: ['ins-2b'], title: `Overflow in L`,
        text: `L is full, so ${K(k, 1)} does not fit. L must <b>split</b>.`,
        hl: { nodes: { [L.id]: 'warn' }, keys: { [L.id]: { [k]: 'new' } }, tags: { [L.id]: 'L' } },
        scratch: { items: L.keys.slice(), mid, star: true, note: 'middle key' }
      });
      let cur = L;
      while (true) {
        const m = Math.floor((t.cap + 1) / 2);
        const right = { id: t.nextId++, leaf: cur.leaf, keys: [], children: [], from: cur.id };
        let up;
        if (cur.leaf) { right.keys = cur.keys.splice(m); up = right.keys[0]; }
        else { right.keys = cur.keys.splice(m + 1); up = cur.keys.pop(); right.children = cur.children.splice(m + 1); }
        right.floating = { key: up, mode: cur.leaf ? 'copy up' : 'push up' };
        let parent, pi, grew = false;
        if (path.length) ({ n: parent, i: pi } = path.pop());
        else { parent = { id: t.nextId++, leaf: false, keys: [], children: [cur], ghost: true }; t.root = parent; pi = 0; grew = true; }
        parent.children.splice(pi + 1, 0, right);
        const rootNote = grew ? ` The root split, so a new root is needed.` : '';
        if (cur.leaf) add({
          algo: ['ins-2b'], title: `Split L, copy up ${up}`,
          text: `The middle key ${K(up)} is <b>copied up</b>: it stays in L₂ and a copy goes to the parent.${rootNote}`,
          hl: { nodes: { [cur.id]: 'active', [right.id]: 'new' }, keys: { [cur.id]: { [k]: 'new' }, [right.id]: { [k]: 'new', [up]: 'up' } }, tags: { [cur.id]: 'L', [right.id]: 'L₂' } }
        });
        else add({
          algo: ['ins-3'], level: 'index level', title: `Split, push up ${up}`,
          text: `The middle key ${K(up)} is <b>pushed up</b>: it moves to the parent and leaves this level.${rootNote}`,
          hl: { nodes: { [cur.id]: 'active', [right.id]: 'new' } }
        });
        delete right.floating; delete parent.ghost;
        parent.keys.splice(pi, 0, up);
        if (parent.keys.length <= t.cap) {
          add({
            algo: ['ins-3'], title: grew ? `New root: height grows` : `Parent takes ${up}`,
            text: grew ? `The new root holds ${K(up)}. The root is exempt from the fill factor.${DONE}` : `The parent has space.${DONE}`,
            hl: { nodes: { [parent.id]: 'new', [right.id]: 'new' }, keys: { [parent.id]: { [up]: 'up' } } }
          });
          return;
        }
        const m2 = Math.floor((t.cap + 1) / 2);
        add({
          algo: ['ins-3'], title: `Overflow in the parent`,
          text: `${K(up)} does not fit. Split again, one level up.`,
          hl: { nodes: { [parent.id]: 'warn' }, keys: { [parent.id]: { [up]: 'up' } } },
          scratch: { items: parent.keys.slice(), mid: m2, star: false, note: 'middle key' }
        });
        cur = parent;
      }
    }

    function fixUnderflow(n, path) {
      const { n: p, i } = path.pop();
      const left = i > 0 ? p.children[i - 1] : null, right = i < p.children.length - 1 ? p.children[i + 1] : null;
      const leaf = n.leaf;
      const min = leaf ? minLeaf(t) : minPtr(t) - 1;
      const can = s => s && s.keys.length > min;
      const sib = (s, side) => `${side}: ${s ? (can(s) ? 'can lend' : 'at minimum') : 'none'}`;
      const hlS = {}; if (left) hlS[left.id] = 'sib'; if (right) hlS[right.id] = 'sib'; hlS[n.id] = 'warn';
      add({
        algo: ['del-2b'], level: leaf ? null : 'index level', title: `Can a sibling lend?`,
        text: `${sib(left, 'Left')}. ${sib(right, 'Right')}.${can(left) || can(right) ? '' : ' Re-distribution fails, so <b>merge</b>.'}`,
        hl: { nodes: hlS, tags: leaf ? { [n.id]: 'L' } : {} }
      });
      if (can(left) || can(right)) {
        const fromLeft = can(left), s = fromLeft ? left : right, si = fromLeft ? i - 1 : i, oldSep = p.keys[si], side = fromLeft ? 'left' : 'right';
        let moved;
        if (leaf) {
          if (fromLeft) { moved = left.keys.pop(); n.keys.unshift(moved); p.keys[si] = n.keys[0]; }
          else { moved = right.keys.shift(); n.keys.push(moved); p.keys[si] = right.keys[0]; }
          add({ algo: ['del-2b'], title: `Borrow ${moved}* from the ${side}`, text: `The separator key in the parent becomes ${K(p.keys[si])}.${DONE}`, hl: { nodes: { [n.id]: 'new', [s.id]: 'sib', [p.id]: 'active' }, keys: { [n.id]: { [moved]: 'moved' }, [p.id]: { [p.keys[si]]: 'up' } } } });
        } else {
          let sub;
          if (fromLeft) { moved = left.keys.pop(); sub = left.children.pop(); n.keys.unshift(oldSep); n.children.unshift(sub); p.keys[si] = moved; }
          else { moved = right.keys.shift(); sub = right.children.shift(); n.keys.push(oldSep); n.children.push(sub); p.keys[si] = moved; }
          add({ algo: ['del-2b'], level: 'index level', title: `Borrow through the parent`, text: `${K(oldSep)} comes down, ${K(moved)} goes up, and one subtree moves across.${DONE}`, hl: { nodes: { [n.id]: 'new', [s.id]: 'sib', [p.id]: 'active', [sub.id]: 'moved' }, keys: { [n.id]: { [oldSep]: 'moved' }, [p.id]: { [moved]: 'up' } } } });
        }
        return;
      }
      const withLeft = !!left, Ln = withLeft ? left : n, Rn = withLeft ? n : right, si = withLeft ? i - 1 : i, sep = p.keys[si];
      if (leaf) Ln.keys = Ln.keys.concat(Rn.keys);
      else { Ln.keys = Ln.keys.concat([sep], Rn.keys); Ln.children = Ln.children.concat(Rn.children); }
      p.keys.splice(si, 1); p.children.splice(si + 1, 1);
      add({
        algo: ['del-2c'], level: leaf ? null : 'index level', title: leaf ? `Merge leaves, toss ${sep}` : `Merge, pull down ${sep}`,
        text: leaf ? `The separator key ${K(sep)} is <b>tossed</b> from the parent.` : `The separator key ${K(sep)} is <b>pulled down</b> between the two halves.`,
        hl: { nodes: { [Ln.id]: 'new', [p.id]: 'active' }, keys: leaf ? {} : { [Ln.id]: { [sep]: 'moved' } } }
      });
      if (p === t.root) {
        if (p.keys.length === 0) {
          add({ algo: ['del-2c'], level: 'root', title: `The root is empty`, text: `It has one pointer and no keys.`, hl: { nodes: { [p.id]: 'warn' } } });
          t.root = Ln;
          add({ algo: ['del-2c'], level: 'root', title: `Remove the root: height shrinks`, text: `The merged node becomes the root.${DONE}`, hl: { nodes: { [Ln.id]: 'new' } } });
        } else add({ algo: ['del-2c'], level: 'root', title: `The root is exempt`, text: `The fill factor does not apply to the root.${DONE}`, hl: { nodes: { [p.id]: 'active' } } });
        return;
      }
      if (p.keys.length + 1 >= minPtr(t)) {
        add({ algo: ['del-2c'], title: `Parent meets the fill factor`, text: `It still has at least ${minPtr(t)} pointers.${DONE}`, hl: { nodes: { [p.id]: 'active' } } });
        return;
      }
      add({ algo: ['del-2c'], level: 'index level', title: `Underflow in the parent`, text: `It needs at least ${minPtr(t)} pointers. Repair it the same way, one level up.`, hl: { nodes: { [p.id]: 'warn' } } });
      fixUnderflow(p, path);
    }

    function del(k) {
      const { path, leaf: L } = descend(k);
      if (!L.keys.includes(k)) {
        add({ algo: ['del-1'], title: `${k}* is not in the tree`, text: `Nothing to delete.`, hl: { nodes: { [L.id]: 'active' }, tags: { [L.id]: 'L' } } });
        return;
      }
      add({ algo: ['del-1'], title: `Found ${k}*`, text: `Remove it from leaf L.`, hl: { nodes: { [L.id]: 'active' }, keys: { [L.id]: { [k]: 'del' } }, tags: { [L.id]: 'L' } } });
      L.keys.splice(L.keys.indexOf(k), 1);
      if (L === t.root) {
        add({ algo: ['del-2a'], title: `Removed ${k}*`, text: `L is the root, so the fill factor does not apply.${DONE}`, hl: { nodes: { [L.id]: 'new' }, tags: { [L.id]: 'L' } } });
        return;
      }
      if (L.keys.length >= minLeaf(t)) {
        add({ algo: ['del-2a'], title: `L meets the fill factor`, text: `It still has at least ${minLeaf(t)} entries.${DONE}`, hl: { nodes: { [L.id]: 'new' }, tags: { [L.id]: 'L' } } });
        return;
      }
