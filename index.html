<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>body{margin:0}</style>
</head>
<body>
<title>B+ Tree Visualizer</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=Red+Hat+Display:wght@600;700;800&family=Source+Sans+3:wght@400;600;700&display=swap">
<style>
/* Layout: lecture-slide workbench. Preset rail on top, the tree as the stage, and beneath it the narration, the slide algorithm and the step trace side by side. */
:root{
  --bg:#f1f3f4; --surface:#ffffff; --stage:#fafbfc; --ink:#18233f; --muted:#5b6880; --line:#d5dbe3;
  --accent:#0e7c7b; --accent-soft:#dff1ef; --on-accent:#ffffff;
  --leaf-bg:#e8f5f3; --leaf-line:#2a9d8f; --idx-bg:#1b2a4a; --idx-fg:#ffffff; --idx-line:#1b2a4a; --edge:#8a97ab;
  --new:#15803d; --del:#c62828; --up:#b45309; --mov:#1d4ed8; --on-sem:#ffffff;
  --f-display:"Red Hat Display","Segoe UI",system-ui,sans-serif;
  --f-body:"Source Sans 3","Segoe UI",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0f141c; --surface:#171f2b; --stage:#121923; --ink:#e7ecf3; --muted:#97a3b6; --line:#2c394b;
  --accent:#3ccfc0; --accent-soft:#143532; --on-accent:#06211f;
  --leaf-bg:#12302e; --leaf-line:#3ccfc0; --idx-bg:#33456b; --idx-fg:#ffffff; --idx-line:#6079ab; --edge:#62728a;
  --new:#1f9a4f; --del:#d64545; --up:#c27a12; --mov:#3f74e6; --on-sem:#ffffff; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0f141c; --surface:#171f2b; --stage:#121923; --ink:#e7ecf3; --muted:#97a3b6; --line:#2c394b;
  --accent:#3ccfc0; --accent-soft:#143532; --on-accent:#06211f;
  --leaf-bg:#12302e; --leaf-line:#3ccfc0; --idx-bg:#33456b; --idx-fg:#ffffff; --idx-line:#6079ab; --edge:#62728a;
  --new:#1f9a4f; --del:#d64545; --up:#c27a12; --mov:#3f74e6; --on-sem:#ffffff; color-scheme:dark }

*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font:16px/1.5 var(--f-body)}
.wrap{max-width:1280px;margin:0 auto;padding-block:20px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance}
h1{font-size:20px;font-weight:800}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.top{display:flex;flex-wrap:wrap;align-items:center;gap:8px 24px}
.presets{display:flex;flex-wrap:wrap;gap:2px 4px}
.preset{background:none;border:0;border-bottom:2px solid transparent;padding:4px 8px;color:var(--muted);font-weight:600}
.preset:hover{color:var(--ink)}
.preset[aria-pressed="true"]{color:var(--accent);border-bottom-color:var(--accent)}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.ops{display:flex;flex-wrap:wrap;gap:6px}
.op,.btn{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:5px 11px;font-weight:600}
.op{font:600 14px var(--f-mono)}
.op:hover,.btn:hover{border-color:var(--accent)}
.op.done{opacity:.45}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn:disabled{opacity:.4;cursor:default}
.spacer{flex:1}
.bar input{width:120px;padding:5px 9px;border:1px solid var(--line);border-radius:8px;background:var(--surface);font:500 14px var(--f-mono)}
.msg{color:var(--del);font-size:14px}
.main{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:14px;align-items:stretch}
@media (max-width:1100px){.main{grid-template-columns:minmax(0,1fr)} .algo .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr))} .card.note{grid-column:1/-1}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;min-width:0}
.stage{display:flex;flex-direction:column}
.scroll{overflow-x:auto;padding:20px 12px;min-height:300px;display:flex;align-items:center;flex:1}
#svg{display:block;margin:0 auto;overflow:visible;flex:none}
.facts,.legend{display:flex;flex-wrap:wrap;gap:4px 18px;padding:10px 18px;font-size:14px;color:var(--muted)}
.facts{border-bottom:1px solid var(--line)} .facts b{color:var(--ink)}
.legend{font-size:13px;padding-top:0}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:11px;height:11px;border-radius:3px;display:inline-block;flex:none}
.now{border-top:1px solid var(--line);padding:14px 18px 16px;display:flex;flex-direction:column;gap:8px}
.count{color:var(--muted);font-size:14px;font-variant-numeric:tabular-nums}
#title{font-size:20px;font-weight:700;line-height:1.25}
#text{font-size:17px;margin:0;max-width:72ch;min-height:3em}
.k{font-family:var(--f-mono);font-weight:600}
.scratch{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.scratch i{font:600 15px var(--f-mono);font-style:normal;padding:2px 7px;border-radius:5px}
.scratch i.mid{background:var(--up);color:var(--on-sem)}
.scratch em{color:var(--muted);font-style:normal;font-size:14px;margin-left:6px}
.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.algo{padding:16px}
.algo h3{font-size:16px;margin-bottom:10px}
.cards{display:flex;flex-direction:column;gap:6px}
.card{display:grid;grid-template-columns:30px minmax(0,1fr);gap:10px;align-items:start;border:1px solid transparent;border-radius:10px;padding:8px;color:var(--muted)}
.card .n{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font:700 12.5px var(--f-body);background:var(--bg)}
.card b{display:block;line-height:1.3;padding-top:4px}
.card p{margin:3px 0 0;font-size:14px;line-height:1.4}
.card.seen{color:var(--ink)}
.card.seen .n{background:var(--accent-soft);color:var(--accent)}
.card.on{border-color:var(--accent);background:var(--accent-soft);color:var(--ink)}
.card.on .n{background:var(--accent);color:var(--on-accent)}
.card .lvl{display:block;margin-top:4px;font-size:13px;font-weight:700;color:var(--accent)}
.card.note{grid-template-columns:minmax(0,1fr)}
.card.note p{margin:0}

/* SVG */
.edge{stroke:var(--edge);stroke-width:1.4}
.edge.on{stroke:var(--accent);stroke-width:3}
.link{stroke:var(--edge);stroke-width:1.4}
.linkhead{fill:none;stroke:var(--edge);stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
.box{stroke-width:1.6}
.leaf .box{fill:var(--leaf-bg);stroke:var(--leaf-line)}
.idx .box{fill:var(--idx-bg);stroke:var(--idx-line)}
.div{stroke-width:1}
.leaf .div{stroke:var(--leaf-line);opacity:.45}
.idx .div{stroke:var(--idx-fg);opacity:.28}
.key{font:600 13.5px var(--f-mono);text-anchor:middle;dominant-baseline:central}
.leaf .key{fill:var(--ink)} .idx .key{fill:var(--idx-fg)}
.dot{fill:var(--idx-fg);stroke:var(--idx-line);stroke-width:1.2}
.ring{fill:none;stroke-width:3}
.s-active .ring{stroke:var(--accent)} .s-new .ring{stroke:var(--new)} .s-warn .ring{stroke:var(--del);stroke-dasharray:6 4}
.s-sib .ring{stroke:var(--mov);stroke-dasharray:2 4} .s-moved .ring{stroke:var(--mov)}
.kc{stroke:none}
.kc.new{fill:var(--new)} .kc.del{fill:var(--del)} .kc.up{fill:var(--up)} .kc.moved{fill:var(--mov)}
.key.hl{fill:var(--on-sem)}
.occ{font:600 11.5px var(--f-mono);fill:var(--muted);text-anchor:middle}
.occ.side{text-anchor:start;dominant-baseline:central}
.occ.bad{fill:var(--del)}
.tag{font:700 13px var(--f-body);fill:var(--ink)}
.occ.up{fill:var(--up);font-weight:700}
.pending .box{fill-opacity:.25;stroke-dasharray:5 4}
</style>

<div class="wrap">
  <div class="top">
    <h1>B+ Tree Visualizer</h1>
    <div class="presets" id="presets"></div>
  </div>
  <div class="bar">
    <div class="ops" id="ops"></div>
    <span class="spacer"></span>
    <input id="keys" inputmode="numeric" placeholder="your key" aria-label="Your own key or keys" autocomplete="off">
    <button class="btn" id="doIns">Insert</button>
    <button class="btn" id="doDel">Delete</button>
    <button class="btn" id="reset">Reset</button>
    <span class="msg" id="msg" role="status"></span>
  </div>
  <div class="main">
    <section class="panel stage">
      <div class="facts" id="facts"></div>
      <div class="scroll" id="scroll"><svg id="svg" role="img" aria-label="B+ tree diagram"></svg></div>
      <div class="legend">
        <span><i class="sw" style="background:var(--idx-bg)"></i>index</span>
        <span><i class="sw" style="background:var(--leaf-bg);border:1.5px solid var(--leaf-line)"></i>leaf</span>
        <span><i class="sw" style="background:var(--new)"></i>inserted</span>
        <span><i class="sw" style="background:var(--del)"></i>deleted / violation</span>
        <span><i class="sw" style="background:var(--up)"></i>moved up</span>
        <span><i class="sw" style="background:var(--mov)"></i>moved across</span>
      </div>
      <div class="now" aria-live="polite">
        <h2 id="title"></h2>
        <p id="text"></p>
        <div class="scratch" id="scratch" hidden></div>
        <div class="controls">
          <button class="btn" id="prev">← Back</button>
          <button class="btn primary" id="next">Next →</button>
          <span class="count" id="count"></span>
        </div>
      </div>
    </section>
    <section class="panel algo" id="algo"></section>
  </div>
</div>

<script>
/* ===== B+ tree engine =====
   cap = max entries in a leaf = max keys in an index node (cap+1 pointers).
   Routing: left subtree keys < separator <= right subtree keys. Equality goes right.
   A separator can remain a valid boundary after its leaf entry is deleted.
   Fill factor 50%, counted in pointers: leaf >= ceil(cap/2) entries, index node >= ceil((cap+1)/2) pointers. Root exempt. */
const E = (() => {
  const clone = o => JSON.parse(JSON.stringify(o));
  const minLeaf = t => Math.ceil(t.cap / 2);
  const minPtr = t => Math.ceil((t.cap + 1) / 2);
  const K = (v, star) => `<b class="k">${v}${star ? '*' : ''}</b>`;
  const ord = i => ['1st', '2nd', '3rd', '4th', '5th', '6th'][i] || (i + 1) + 'th';
  const DONE = ' <b>Done.</b>';

  function build(t, s) {
    if (Array.isArray(s)) return { id: t.nextId++, leaf: true, keys: s.slice(), children: [] };
    const n = { id: t.nextId++, leaf: false, keys: s.k.slice(), children: [] };
    n.children = s.c.map(c => build(t, c));
    return n;
  }
  function make(cap, spec) {
    const t = { cap, nextId: 1, root: null };
    t.root = build(t, spec);
    return t;
  }
  const route = (n, k) => { let i = 0; while (i < n.keys.length && k >= n.keys[i]) i++; return i; };
  function routeText(n, k, i) {
    const ks = n.keys;
    if (i === 0) return { cmp: `${k} &lt; ${ks[0]}`, ptr: 'the leftmost pointer' };
    if (i === ks.length) return { cmp: `${k} ≥ ${ks[i - 1]}`, ptr: 'the rightmost pointer' };
    return { cmp: `${ks[i - 1]} ≤ ${k} &lt; ${ks[i]}`, ptr: `the ${ord(i)} pointer` };
  }
  function insertSorted(a, k) { let i = 0; while (i < a.length && a[i] < k) i++; a.splice(i, 0, k); }

  function runner(t, op, steps) {
    const add = s => { s.tree = clone(t); s.op = op; s.hl = s.hl || {}; steps.push(s); };
    const algoOf = { insert: 'ins', delete: 'del', search: 'find' }[op.type];

    function descend(k) {
      const path = []; let n = t.root;
      while (!n.leaf) {
        const i = route(n, k), r = routeText(n, k, i);
        add({
          algo: [algoOf + '-1'], title: r.cmp,
          text: `Follow ${r.ptr}.${i > 0 && n.keys[i - 1] === k ? ' An equal key goes right.' : ''}`,
          hl: { nodes: { [n.id]: 'active' }, edge: [n.id, i] }
        });
        path.push({ n, i }); n = n.children[i];
      }
      return { path, leaf: n };
    }

    function insert(k) {
      const { path, leaf: L } = descend(k);
      if (L.keys.includes(k)) {
        add({ algo: ['ins-1'], title: `${k}* already exists`, text: `Search keys are unique here. Nothing changes.`, hl: { nodes: { [L.id]: 'active' }, keys: { [L.id]: { [k]: 'moved' } }, tags: { [L.id]: 'L' } } });
        return;
      }
      const tagL = { [L.id]: 'L' };
      if (L.keys.length < t.cap) {
        add({ algo: ['ins-2'], title: `L has space`, text: `L holds ${L.keys.length} of ${t.cap} entries, so ${K(k, 1)} fits.`, hl: { nodes: { [L.id]: 'active' }, tags: tagL } });
        insertSorted(L.keys, k);
        add({ algo: ['ins-2'], title: `Insert ${k}* into L`, text: `It goes in at its sorted position.${DONE}`, hl: { nodes: { [L.id]: 'new' }, keys: { [L.id]: { [k]: 'new' } }, tags: tagL } });
        return;
      }
      add({ algo: ['ins-3'], title: `L is full`, text: `L already holds ${t.cap} of ${t.cap} entries. ${K(k, 1)} does not fit, so L must <b>split</b>.`, hl: { nodes: { [L.id]: 'warn' }, tags: tagL } });
      insertSorted(L.keys, k);
      const mid = Math.floor((t.cap + 1) / 2);
      add({
        algo: ['ins-3'], title: `Line up all ${t.cap + 1} entries`,
        text: `Put ${K(k, 1)} at its sorted position. The middle key ${K(L.keys[mid], 1)} marks where to split.`,
        hl: { nodes: { [L.id]: 'warn' }, keys: { [L.id]: { [k]: 'new' } }, tags: tagL },
        scratch: { items: L.keys.slice(), mid, star: true, note: 'middle key' }
      });
      let cur = L;
      while (true) {
        const m = Math.floor((t.cap + 1) / 2), leaf = cur.leaf;
        const A = leaf ? 'L' : 'N', B = leaf ? 'L₂' : 'N₂', al = [leaf ? 'ins-3' : 'ins-4'], lv = leaf ? null : 'index level';
        const right = { id: t.nextId++, leaf, keys: [], children: [], from: cur.id, loose: true };
        let parent, pi, grew = false;
        if (path.length) ({ n: parent, i: pi } = path.pop());
        else { parent = { id: t.nextId++, leaf: false, keys: [], children: [cur], ghost: 'hidden' }; t.root = parent; pi = 0; grew = true; }
        parent.children.splice(pi + 1, 0, right);
        const tags = { [cur.id]: A, [right.id]: B }, pair = { [cur.id]: 'active', [right.id]: 'new' };
        const all = (ks, c) => { const o = {}; ks.forEach(x => o[x] = c); return o; };
        // 1. allocate the new node
        add({ algo: al, level: lv, title: `Create a new ${leaf ? 'leaf' : 'index node'} ${B}`, text: `${B} starts empty, to the right of ${A}. ${leaf ? 'Link it into the leaf chain. Its parent pointer comes later.' : 'Its parent pointer comes later.'}`, hl: { nodes: pair, tags } });
        // 2. move the upper half across
        let up;
        if (leaf) {
          right.keys = cur.keys.splice(m);
          add({ algo: al, title: `Move ${right.keys.length} entries to ${B}`, text: `${A} keeps the first ${m} entries. Everything from the middle key ${K(right.keys[0], 1)} on moves to ${B}.`, hl: { nodes: pair, keys: { [right.id]: all(right.keys, 'moved') }, tags } });
          up = right.keys[0];
          right.floating = { key: up, mode: 'copy up' };
          // 3. copy up
          add({ algo: al, title: `Copy up ${up}`, text: `The middle key ${K(up)} is <b>copied up</b>: ${K(up, 1)} stays in ${B} and a copy heads for the parent.`, hl: { nodes: pair, keys: { [right.id]: { [up]: 'up' } }, tags } });
        } else {
          right.keys = cur.keys.splice(m + 1); right.children = cur.children.splice(m + 1);
          add({ algo: al, level: lv, title: `Move ${right.keys.length} key${right.keys.length === 1 ? '' : 's'} and ${right.children.length} pointers to ${B}`, text: `Everything right of the middle key ${K(cur.keys[m])} moves to ${B}. The middle key is left over at the end of ${A}, with no pointer after it.`, hl: { nodes: pair, keys: { [right.id]: all(right.keys, 'moved'), [cur.id]: { [cur.keys[m]]: 'up' } }, tags } });
          up = cur.keys.pop();
          right.floating = { key: up, mode: 'push up' };
          // 3. push up
          add({ algo: al, level: lv, title: `Push up ${up}`, text: `The middle key ${K(up)} is <b>pushed up</b>: it leaves this level and heads for the parent.`, hl: { nodes: pair, tags } });
        }
        // 4. no parent → make one
        if (grew) {
          parent.ghost = 'pending';
          add({ algo: ['ins-4'], level: 'root', title: `No parent: create a new root`, text: `${A} was the root, so ${K(up)} has nowhere to go. A new, empty root is created above.`, hl: { nodes: pair, tags } });
        }
        // 5. parent takes the key and the pointer
        delete right.floating; delete right.loose; delete parent.ghost;
        parent.keys.splice(pi, 0, up);
        if (grew) {
          add({ algo: ['ins-4'], level: 'root', title: `The new root takes ${up}: height grows`, text: `It holds ${K(up)}, with one pointer to ${A} and one to ${B}. The root is exempt from the fill factor.${DONE}`, hl: { nodes: { [parent.id]: 'new' }, keys: { [parent.id]: { [up]: 'up' } }, tags } });
          return;
        }
        const fits = parent.keys.length <= t.cap;
        add({
          algo: ['ins-4'], level: 'index level', title: `The parent takes ${up}`,
          text: `${K(up)} goes in together with a pointer to ${B}. ` + (fits ? `The parent has space.${DONE}` : `That makes ${parent.keys.length} keys, one more than fits.`),
          hl: { nodes: { [parent.id]: fits ? 'new' : 'warn', [right.id]: 'new' }, keys: { [parent.id]: { [up]: 'up' } }, tags }
        });
        if (fits) return;
        add({
          algo: ['ins-4'], level: 'index level', title: `Overflow in the parent`,
          text: `The parent must split too. Call it N. Its middle key is ${K(parent.keys[m])}.`,
          hl: { nodes: { [parent.id]: 'warn' }, tags: { [parent.id]: 'N' } },
          scratch: { items: parent.keys.slice(), mid: m, star: false, note: 'middle key' }
        });
        cur = parent;
      }
    }

    // Algorithm sheet / slide 31: on underflow, first try to redistribute by borrowing from a sibling
    // (left first, then right). Only if neither can lend, merge with a sibling.
    function fixUnderflow(n, path) {
      const { n: p, i } = path.pop();
      const left = i > 0 ? p.children[i - 1] : null, right = i < p.children.length - 1 ? p.children[i + 1] : null;
      const leaf = n.leaf, name = leaf ? 'L' : 'N', lv = leaf ? null : 'index level', tags = { [n.id]: name };
      const al = ['del-4'], kind = leaf ? 'leaf' : 'node', unit = leaf ? 'entries' : 'pointers';
      const min = leaf ? minLeaf(t) : minPtr(t), size = x => leaf ? x.keys.length : x.children.length;
      const can = x => x && size(x) > min;
      const all = (ks, c) => { const o = {}; ks.forEach(x => o[x] = c); return o; };
      const ask = (x, side, note) => add({
        algo: ['del-3'], level: lv, title: `Can the ${side} sibling lend?`,
        text: (can(x) ? `It has ${size(x)} ${unit}, more than the minimum of ${min}. <b>It can lend one.</b>` : `It has the minimum of ${min} ${leaf && min === 1 ? 'entry' : unit}. Lending one would leave it underfull.`) + note,
        hl: { nodes: { [n.id]: 'warn', [x.id]: 'sib', [p.id]: 'active' }, tags }
      });
      // check one sibling at a time: left first, then right
      let s = null;
      if (left) { ask(left, 'left', !right && !can(left) ? ` There is no right sibling under this parent.` : ''); if (can(left)) s = left; }
      if (!s && right) { ask(right, 'right', left ? '' : ` (There is no left sibling under this parent.)`); if (can(right)) s = right; }
      if (s) {
        const al = ['del-3'];
        const fromLeft = s === left, si = fromLeft ? i - 1 : i, oldSep = p.keys[si], side = fromLeft ? 'left' : 'right';
        let moved;
        if (leaf) {
          if (fromLeft) { moved = s.keys.pop(); n.keys.unshift(moved); } else { moved = s.keys.shift(); n.keys.push(moved); }
          add({
            algo: al, title: `Move ${moved}* from the ${side} sibling`,
            text: `L is back to ${n.keys.length} entries. The parent still routes ${K(moved)} to the ${side} sibling. Update its separator so a search reaches L.`,
            hl: { nodes: { [n.id]: 'new', [s.id]: 'sib' }, keys: { [n.id]: { [moved]: 'moved' }, [p.id]: { [oldSep]: 'del' } }, tags }
          });
          const first = fromLeft ? n : s, ns = first.keys[0];
          p.keys[si] = ns;
          add({
            algo: al, title: `Replace separator ${oldSep} with ${ns}`,
            text: `The new separator is a copy of ${K(ns, 1)}, the first entry of the leaf on its right.${DONE}`,
            hl: { nodes: { [p.id]: 'active' }, keys: { [p.id]: { [ns]: 'up' }, [first.id]: { [ns]: 'up' } }, tags }
          });
        } else {
          p.keys[si] = null;
          if (fromLeft) { n.keys.unshift(oldSep); n.ptrOff = 1; } else n.keys.push(oldSep);
          add({
            algo: al, level: lv, title: `Pull down ${oldSep}`,
            text: `The separator ${K(oldSep)} comes down from the parent into N, leaving a gap. It has no pointer of its own yet.`,
            hl: { nodes: { [n.id]: 'new', [s.id]: 'sib', [p.id]: 'active' }, keys: { [n.id]: { [oldSep]: 'moved' } }, tags }
          });

  $('count').textContent = s.op ? `${VERB[s.op.type]} ${s.op.key}* · step ${idx + 1} of ${steps.length}` : '';
  let h = 1; for (let n = s.tree.root; !n.leaf; n = n.children[0]) if (!n.ghost) h++;
  const c = s.tree.cap;
  $('facts').innerHTML = `<span>order <b>d = ${c / 2}</b></span><span>non-root leaf <b>${E.minLeaf(s.tree)}–${c}</b> entries</span><span>non-root index <b>${E.minPtr(s.tree)}–${c + 1}</b> pointers</span><span>height <b>${h}</b></span>`;
  $('title').innerHTML = s.title; $('text').innerHTML = s.text;
  const sc = $('scratch'); sc.hidden = !s.scratch;
  if (s.scratch) sc.innerHTML = s.scratch.items.map((v, i) => `<i class="${i === s.scratch.mid ? 'mid' : ''}">${v}${s.scratch.star ? '*' : ''}</i>`).join('') + `<em>${s.scratch.note}</em>`;
  $('prev').disabled = idx === 0; $('next').disabled = idx === steps.length - 1;
}
function render(animate = true) { showTree(animate); renderNow(); renderAlgo(); renderOps(); }
function go(i) { i = Math.max(0, Math.min(steps.length - 1, i)); if (i === idx) return; idx = i; render(); }
function stop() { clearInterval(timer); timer = 0; }
function idle(t, title, text) { return { tree: E.clone(t), op: null, algo: [], title, text, hl: {} }; }
function runOps(ops) {
  stop();
  const t = E.clone(steps[steps.length - 1].tree), out = [];
  (function strip(n) { delete n.from; n.children.forEach(strip); })(t.root);
  ops.forEach(o => E.run(t, o, out));
  if (!out.length) return;
  steps = out; idx = 0; render();
}
function renderOps() {
  $('ops').innerHTML = sc.ops.map((o, i) => `<button class="op${done.has(i) ? ' done' : ''}" data-i="${i}" title="In the example sequence: ${o[2]}">${VERB[o[0]]} ${o[1]}</button>`).join('');
}
function load(i) {
  stop(); scIdx = i; sc = SCENARIOS[i]; done = new Set(); curPos = null;
  steps = [idle(E.make(sc.cap, sc.tree), sc.name, 'For the example sequence, run the operations from left to right. Use Next to step through each one.')];
  idx = 0;
  $('presets').innerHTML = SCENARIOS.map((s, j) => `<button class="preset" data-i="${j}" aria-pressed="${j === i}">${s.name}</button>`).join('');
  render(false);
}

$('presets').onclick = e => { const b = e.target.closest('.preset'); if (b) load(+b.dataset.i); };
$('ops').onclick = e => { const b = e.target.closest('.op'); if (!b) return; const i = +b.dataset.i, o = sc.ops[i]; done.add(i); runOps([{ type: o[0], key: o[1] }]); };
function custom(type) {
  const raw = $('keys').value.trim().split(/[\s,]+/).filter(Boolean), keys = raw.map(Number);
  if (!raw.length || keys.some(k => !Number.isInteger(k) || k < 0 || k > 999) || keys.length > 12) { $('msg').textContent = 'Enter 1 to 12 whole numbers from 0 to 999.'; return; }
  $('msg').textContent = ''; $('keys').value = '';
  runOps(keys.map(key => ({ type, key })));
}
$('doIns').onclick = () => custom('insert'); $('doDel').onclick = () => custom('delete');
$('keys').onkeydown = e => { if (e.key === 'Enter') custom('insert'); };
$('reset').onclick = () => load(scIdx);
$('prev').onclick = () => { stop(); go(idx - 1); }; $('next').onclick = () => { stop(); go(idx + 1); };

document.addEventListener('keydown', e => {
  if (/INPUT|SELECT|TEXTAREA/.test(e.target.tagName)) return;
  if (e.key === 'ArrowRight') { stop(); go(idx + 1); e.preventDefault(); }
  if (e.key === 'ArrowLeft') { stop(); go(idx - 1); e.preventDefault(); }
});
let rz; addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(() => showTree(false), 120); });
load(1);
})();
</script>
